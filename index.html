<body data-page-node-id="WvuqrQs66hZDShLHTAUQSe">

  <h1 data-page-node-id="hXOD229AuHbZLdiKqbIiMC">🖥️ PC 远程控制</h1>

  <div class="card" data-page-node-id="Dd7IhKItO9qnPNoQCBDxRf">

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
const TOPIC = "Computer006";        // 巴法云后台的设备/主题名
const TOPIC_CMD  = TOPIC + "/set";   // 手机发命令：Computer006/set
const TOPIC_STAT = TOPIC;            // ESP 发布 retain 状态
const TOPIC_PC   = "Computer006pc";   // 路由器发布电脑在线状态（独立主题，避免与 ESP 状态 retain 互相覆盖）

// 固化 UID（混淆编码，运行时还原）：换设备打开无需手动输入
function _decodeUid() {
  const enc = "386b6c693e6e396369696838633c38626d3f3c6e3c6a6e396c6e6b386a693e69";
  const k = 0x5a;
  let s = "";
  for (let i = 0; i < enc.length; i += 2) s += String.fromCharCode(parseInt(enc.substr(i, 2), 16) ^ k);
  return s.split("").reverse().join("");
}
const BUILTIN_UID = _decodeUid();

let client = null;
const $ = id => document.getElementById(id);

// 读取已保存 UID（优先本地覆盖值，否则用固化 UID）
const saved = localStorage.getItem("bemfa_uid") || "";
$("uid").value = saved || BUILTIN_UID;

function setConn(txt, color) {
  $("connTxt").textContent = txt;
  $("connTxt").style.color = color || "#8a8f98";
}

function updateEsp(text) {
  // text: "online,-45" 或 "offline"
  if (text === "offline" || !text) {
    $("espDot").className = "dot off";
    $("espRssi").textContent = "离线";
  } else {
    $("espDot").className = "dot on";
    const parts = text.split(",");
    $("espRssi").textContent = parts[1] ? "RSSI " + parts[1] : "在线";
  }
}
// ── 电脑在线：心跳新鲜度判定 ──
// 巴法云在 WebSocket 连接断开时不会补发 MQTT 遗嘱，进程被强杀/断电后
// 主题上会残留 retain 的 "1"，只靠 0/1 判断会误报"在线"。
// 对策：监控脚本每 30s 重发一次带时间戳的心跳信标 "1,<unix秒>"；
//       这里用时间戳算年龄，超过阈值没收到新心跳就判离线。
const PC_HEARTBEAT_TIMEOUT_MS = 35000;   // 信标 10s，容忍连续丢 3 个
let pcLastTs     = 0;   // 见过的最新信标时间戳（unix 秒），只用于判重
let pcLastFresh  = 0;   // 该信标到达本机的时刻(ms)
let pcHadHistory = false;
let pcHardOff    = false;   // 收到过明确的 "0"

function updatePc(v) {
  const s = String(v == null ? "" : v);
  if (s === "0") {                       // 电脑主动上报关机（优雅退出）
    pcHardOff = true; pcLastFresh = 0; pcLastTs = 0; renderPc(); return;
  }
  pcHardOff = false;
  if (s === "1") {                       // 旧格式：无时间戳，按到达时间刷新
    pcHadHistory = true; pcLastFresh = Date.now(); pcLastTs = 0;
  } else if (s.indexOf("1,") === 0) {
    const ts = parseInt(s.slice(2), 10);
    if (!isNaN(ts)) {
      pcHadHistory = true;
      // 只有时间戳变大才算新信标。断线重连时 broker 会把 retain 的旧信标再推一次，
      // ts 不变 → 不刷新新鲜度 → 不会把死掉的电脑误判成在线。
      if (ts > pcLastTs) {
        pcLastTs = ts;
        // 二道防线：broker 在 WS 一连上就会立刻推送 retain 的旧信标（实测 <0.1s），
        // 全新打开页面时 pcLastTs 从 0 开始，旧信标能穿过上面的判重，
        // 导致"电脑关机后每次打开页面都显示在线 35 秒"。
        // 兜底：信标声称的发出时刻距今超过 90s → 是残留 retain，不当在线
        //（信标 10s 一次，活信标的时间戳年龄只有几秒；90s 容忍两端时钟偏差）。
        if (Date.now() - ts * 1000 > 90000) {
          pcLastFresh = 0;          // 交给 renderPc 显示"心跳超时 · 可能已关机"
        } else {
          pcLastFresh = Date.now();
        }
      }
    }
  }
  renderPc();
}

function renderPc() {
  const d = $("pcDot"), t = $("pcTxt");
  if (pcHardOff) { d.className = "dot off"; t.textContent = "已关机 / 睡眠"; return; }
  if (pcLastFresh) {
    const ageS = Math.round((Date.now() - pcLastFresh) / 1000);
    if (Date.now() - pcLastFresh < PC_HEARTBEAT_TIMEOUT_MS) {
      d.className = "dot on";
      t.textContent = "已开机 · " + ageS + "s 前心跳";
      return;
    }
    d.className = "dot off"; t.textContent = "心跳超时 " + ageS + "s · 可能已关机"; return;
  }
  if (pcHadHistory) { d.className = "dot off"; t.textContent = "心跳超时 · 可能已关机"; return; }
  d.className = "dot unk"; t.textContent = "未知";
}
setInterval(renderPc, 1000);   // 即使不再来消息，状态也会随时间翻转

function connect(uid) {
  if (client) { try { client.end(true); } catch(e){} }
  setConn("连接中…", "#f5a623");
  client = mqtt.connect("wss://bemfa.com:9504", {
    path: "/wss",
    clientId: uid,
    username: "",   // 巴法云留空
    password: "",
    clean: true,
    reconnectPeriod: 5000
  });

  client.on("connect", () => {
    setConn("已连接 ✓", "#3ddc84");
    $("uidCard").style.display = "none";   // 已保存并连接，默认隐藏配置卡
    $("reconf").style.display = "inline";  // 提供重新配置入口
    client.subscribe(TOPIC);             // ESP 状态 + 命令回复（Computer006）
    client.subscribe(TOPIC_PC);          // 电脑在线状态（Computer006pc）
    refreshBtns();                       // 统一管理按钮启用/冷却状态
  });
  client.on("reconnect", () => setConn("重连中…", "#f5a623"));
  client.on("error", () => { setConn("连接错误", "#ff5c5c"); refreshBtns(); });
  client.on("close", () => { setConn("已断开", "#ff5c5c"); refreshBtns(); });

  client.on("message", (topic, payload) => {
    const msg = payload.toString();
    if (topic === TOPIC_PC) updatePc(msg);   // Computer006pc → 电脑状态
    else updateEsp(msg);                      // Computer006 → ESP 状态
  });
}

$("saveUid").onclick = () => {
  const uid = $("uid").value.trim();
  if (!uid) { alert("请先填入 UID"); return; }
  localStorage.setItem("bemfa_uid", uid);
  connect(uid);
};

// ── 轻提示 toast：点击后立刻给反馈，解决"点了像没点一样" ──
let _toastTimer = null;
function toast(msg, ms) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove("show"), ms || 2400);
}

// ── 防误触：电源类指令发出后进入冷却，期间两个按钮都不可点 ──
// 依据：Windows 收到电源键事件后需 2~5s 才真正进入睡眠/唤醒，
//       冷却期覆盖这段"看不出反应"的窗口，避免用户以为没生效而连点。
const COOLDOWN_POWER_MS = 8000;    // 电源（睡眠/唤醒）
const COOLDOWN_HOLD_MS  = 10000;   // 强制关机（更危险，冷却更久）
let cooldownUntil = 0;
let _cdTimer = null;

function cooldownLeft() {
  return Math.max(0, Math.ceil((cooldownUntil - Date.now()) / 1000));
}

function refreshBtns() {
  const pb = $("btnPower"), hb = $("btnHold");
  const left = cooldownLeft();
  if (left > 0) {
    pb.disabled = hb.disabled = true;
    pb.textContent = "⚡ 已发送，冷却 " + left + "s";
    hb.textContent = "🔌 已发送，冷却 " + left + "s";
  } else {
    if (_cdTimer) { clearInterval(_cdTimer); _cdTimer = null; }
    const ok = !!(client && client.connected);
    pb.disabled = hb.disabled = !ok;
    pb.textContent = "⚡ 电源（睡眠 / 唤醒）";
    hb.textContent = "🔌 强制关机（长按）";
  }
}

function startCooldown(ms) {
  cooldownUntil = Date.now() + ms;
  if (_cdTimer) clearInterval(_cdTimer);
  refreshBtns();
  _cdTimer = setInterval(refreshBtns, 250);
}

// 冷却中 / 未连接 → 给出明确提示并拦截
function canSendOrWarn() {
  const left = cooldownLeft();
  if (left > 0) { toast("冷却中，请 " + left + " 秒后再试"); return false; }
  if (!client || !client.connected) { toast("未连接云端，无法发送"); return false; }
  return true;
}

$("btnPower").onclick = () => {
  if (!canSendOrWarn()) return;
  client.publish(TOPIC_CMD, "toggle");
  toast("⚡ 已发送：睡眠 / 唤醒（约 8 秒后可再操作）");
  startCooldown(COOLDOWN_POWER_MS);
};
$("btnHold").onclick = () => {
  if (!canSendOrWarn()) return;
  if (!confirm("强制关机将直接断电，未保存工作会丢失，确定？")) return;
  client.publish(TOPIC_CMD, "hold");
  toast("🔌 已发送：强制关机（约 10 秒后可再操作）");
  startCooldown(COOLDOWN_HOLD_MS);
};

// 注意：不再于页面加载时自动连接 MQTT —— 改为通过密码验证后才连接（见 unlockApp），
// 避免未授权访问者仅打开页面就建立云端连接。解锁后优先已保存 UID，否则用固化 UID。

// 更换 UID：重新显示配置卡
$("reconf").onclick = (e) => {
  e.preventDefault();
  $("uidCard").style.display = "block";
  $("reconf").style.display = "none";
  $("uid").focus();
};

// ── 访问控制（静态托管，没有服务端）──
// 先说清楚边界：密码写在前端代码里，只能挡住"随手点开链接的人"，挡不住"会按
// F12 看源码的人"。真要防懂行的人，得在页面前面套一层服务端鉴权（Cloudflare
// Access / Nginx Basic Auth / 云函数），那不是改 HTML 能解决的。
// 在这个前提下，下面的目标是：你自己一次都不用再输密码。
function _decodePwd() {
  const enc = "6e2a356263636b75283f2d352a";
  const k = 0x5a;
  let s = "";
  for (let i = 0; i < enc.length; i += 2) s += String.fromCharCode(parseInt(enc.substr(i, 2), 16) ^ k);
  return s.split("").reverse().join("");
}
const ACCESS_PWD = _decodePwd();

// 派生令牌：localStorage / URL 里只放它，不放明文密码
function _token(p) {
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for (let i = 0; i < p.length; i++) {
    h1 = ((h1 ^ p.charCodeAt(i)) * 16777619) >>> 0;
    h2 = ((h2 + p.charCodeAt(i) * (i + 7)) * 2654435761) >>> 0;
  }
  return "pcctl-" + h1.toString(36) + "-" + h2.toString(36);
}
const ACCESS_TOKEN = _token(ACCESS_PWD);
const REMEMBER_DAYS = 30;

function grantSession(persist) {
  try {
    if (persist) {
      localStorage.setItem("pc_auth_token",
        JSON.stringify({ t: ACCESS_TOKEN, exp: Date.now() + REMEMBER_DAYS * 86400000 }));
    }
    sessionStorage.setItem("pc_auth", "1");
  } catch (e) {}
}

function trustedToken() {
  try {
    const o = JSON.parse(localStorage.getItem("pc_auth_token") || "null");
    return !!(o && o.t === ACCESS_TOKEN && (!o.exp || o.exp > Date.now()));
  } catch (e) { return false; }
}

function unlockApp() {
  $("lockScreen").style.display = "none";
  $("app").style.display = "block";
  try { sessionStorage.setItem("pc_auth", "1"); } catch (e) {}
  if (!client) { if (saved) connect(saved); else connect(BUILTIN_UID); }
}

// 三条自动放行路径：URL 带免密令牌 / 本机记住过 / 本标签页已验证过
(function autoUnlock() {
  const k = new URLSearchParams(location.search).get("k");
  if (k && k === ACCESS_TOKEN) {
    grantSession(true);
    history.replaceState(null, "", location.pathname);   // 抹掉地址栏里的令牌
    unlockApp();
    return;
  }
  if (trustedToken() || sessionStorage.getItem("pc_auth") === "1") unlockApp();
})();

$("lockForm").addEventListener("submit", (e) => {
  e.preventDefault();
  if ($("pwd").value === ACCESS_PWD) {
    $("lockErr").style.display = "none";
    grantSession($("remember").checked);
    $("pwd").value = "";
    unlockApp();
  } else {
    $("lockErr").style.display = "block";
    $("pwd").value = "";
    $("pwd").focus();
  }
});

// 生成一次性用到的免密链接：存成书签 / 添加到主屏幕，之后点开直接进
$("makeLink").onclick = (e) => {
  e.preventDefault();
  const url = location.origin + location.pathname + "?k=" + ACCESS_TOKEN;
  const fallback = () => prompt("存成书签，打开即免密码进入：", url);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(() => toast("链接已复制，存成书签即可"), fallback);
  } else { fallback(); }
};

$("lockNow").onclick = (e) => {
  e.preventDefault();
  try { localStorage.removeItem("pc_auth_token"); sessionStorage.removeItem("pc_auth"); } catch (x) {}
  location.reload();
};
</script>
